name: MoliCare New Catalogue Scrapling Checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "molicare_new_catalogue_scrapling.py"
      - ".github/workflows/molicare-new-catalogue.yml"
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "scrapling[fetchers]==0.5"
      - run: python molicare_new_catalogue_scrapling.py
