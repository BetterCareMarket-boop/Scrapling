name: MoliCare Scrapling Batch 7
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "molicare_test_batch7.py"
      - ".github/workflows/molicare-test-batch7.yml"
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "scrapling[fetchers]==0.5"
      - run: python molicare_test_batch7.py
