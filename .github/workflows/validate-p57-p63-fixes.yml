name: Validate P57-P63 SKU fixes with Scrapling
on:
  push:
    branches: [fix-p57-p63-variant-skus]
    paths:
      - "novis_scrapling_rules.py"
      - "validate_p57_p63_fixes.py"
      - ".github/workflows/validate-p57-p63-fixes.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "scrapling[fetchers]==0.5"
      - run: python validate_p57_p63_fixes.py
