name: Targeted MoliCare Extra Checks Nov 5
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "molicare_targeted_extra_nov5.py"
      - ".github/workflows/molicare-targeted-extra-nov5.yml"
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "scrapling[fetchers]==0.5"
      - run: python molicare_targeted_extra_nov5.py
