name: MoliCare Gap Shopify Discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "molicare_gap_shopify_discovery.py"
      - ".github/workflows/molicare-gap-shopify-discovery.yml"
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "scrapling[fetchers]==0.5"
      - run: python molicare_gap_shopify_discovery.py
