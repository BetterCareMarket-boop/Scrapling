name: Inspect Mobility Zone with Scrapling
on:
  push:
    branches: [main]
    paths:
      - "inspect_mobility_zone.py"
      - ".github/workflows/inspect-mobility-zone.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "scrapling[fetchers]==0.5"
      - run: python inspect_mobility_zone.py
