name: Validate NOVIS P55-P63 with Scrapling

on:
  push:
    branches: [validate-p55-p63]
    paths:
      - "batch_p55_p63_scrapling.py"
      - ".github/workflows/validate-p55-p63.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "scrapling[fetchers]==0.5"
      - run: python batch_p55_p63_scrapling.py
