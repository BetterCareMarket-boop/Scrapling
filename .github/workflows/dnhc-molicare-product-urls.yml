name: DNHC Direct Product URL Audit
on:
  push:
    branches: [main]
    paths:
      - "dnhc_molicare_product_urls.py"
      - ".github/workflows/dnhc-molicare-product-urls.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "scrapling[fetchers]==0.5"
      - run: python -m playwright install --with-deps chromium
      - run: python -u dnhc_molicare_product_urls.py
