name: MoliCare Scrapling Test Batch 1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "molicare_test_batch1.py"
      - ".github/workflows/molicare-test-batch1.yml"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Scrapling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "scrapling[fetchers]==0.5"
      - name: Run MoliCare test batch
        run: python molicare_test_batch1.py
