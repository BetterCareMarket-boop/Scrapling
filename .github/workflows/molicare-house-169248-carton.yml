name: MoliCare House Exact 169248 Carton
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "molicare_house_169248_carton.py"
      - ".github/workflows/molicare-house-169248-carton.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "scrapling[fetchers]==0.5"
      - run: python molicare_house_169248_carton.py
