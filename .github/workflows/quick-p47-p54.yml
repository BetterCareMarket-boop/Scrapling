name: Quick Scrapling P47-P54 probe

on:
  push:
    branches: [main]
    paths:
      - "quick_p47_p54.py"
      - ".github/workflows/quick-p47-p54.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "scrapling[fetchers]==0.5"
      - run: python quick_p47_p54.py
