name: Test blocked NOVIS pages using Scrapling browser
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "novis_blocked_stealth_probe.py"
      - ".github/workflows/audit-novis-missing.yml"
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "scrapling[fetchers]==0.5"
      - run: scrapling install --force
      - run: python novis_blocked_stealth_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novis-blocked-stealth-probe
          path: |
            novis_blocked_stealth_probe.json
