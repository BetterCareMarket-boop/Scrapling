name: Audit remaining 45 NOVIS retailer-specific prices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "novis_remaining_45_scrapling.py"
      - ".github/workflows/audit-novis-missing.yml"
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "scrapling[fetchers]==0.5"
      - run: python novis_remaining_45_scrapling.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novis-remaining-45-price-audit
          path: |
            novis_remaining_45_results.json
            novis_remaining_45_results.csv
