name: Inspect Etac Tasty Beaker variants using Scrapling
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "novis_tasty_beaker_variants.py"
      - ".github/workflows/audit-novis-missing.yml"
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "scrapling[fetchers]==0.5"
      - run: python novis_tasty_beaker_variants.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novis-tasty-beaker-variants
          path: |
            novis_tasty_beaker_variants.json
