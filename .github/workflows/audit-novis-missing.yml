name: Recover 20 NOVIS prices with Scrapling
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "novis_price_recovery_20.py"
      - ".github/workflows/audit-novis-missing.yml"
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "scrapling[fetchers]==0.5"
      - run: python novis_price_recovery_20.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novis-price-recovery-20
          path: |
            novis_price_recovery_20.json
            novis_price_recovery_20.csv
