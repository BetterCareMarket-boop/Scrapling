name: MoliCare Missing Price Fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "molicare_missing_price_fix.py"
      - ".github/workflows/molicare-missing-price-fix.yml"
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "scrapling[fetchers]==0.5"
      - run: python molicare_missing_price_fix.py
