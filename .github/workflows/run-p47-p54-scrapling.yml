name: Rerun NOVIS P47-P54 with Scrapling

on:
  push:
    branches: [main]
    paths:
      - "batch_p47_p54_scrapling.py"
      - ".github/workflows/run-p47-p54-scrapling.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "scrapling[fetchers]==0.5"
      - run: python batch_p47_p54_scrapling.py
