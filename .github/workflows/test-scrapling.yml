name: Test Scrapling against NOVIS retailers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "probe_novis.py"
      - ".github/workflows/test-scrapling.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Scrapling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          scrapling install --force
      - name: Show Scrapling version
        run: |
          python - <<'PY'
          import importlib.metadata
          print("scrapling", importlib.metadata.version("scrapling"))
          PY
      - name: Run NOVIS access probe
        run: python probe_novis.py
